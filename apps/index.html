<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f3ec">
<title>智能询价系统</title>
<link rel="stylesheet" href="./styles/base.css?v=21">
<link rel="stylesheet" href="./styles/layout.css?v=21">
<link rel="stylesheet" href="./styles/forms.css?v=21">
<link rel="stylesheet" href="./styles/results.css?v=21">
<link rel="stylesheet" href="./styles/modals.css?v=21">
<link rel="stylesheet" href="./styles/responsive.css?v=21">
</head>
<body>
<div id="authGate" class="auth-gate-overlay" style="display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;">
  <div class="auth-gate-card">
    <h2>智能询价系统</h2>
    <p class="gate-sub">请粘贴管理员发给你的访问链接</p>
    <!-- 主模式：粘贴链接自动解析 -->
    <div style="margin-bottom:1rem;">
      <label class="gate-label">访问链接</label>
      <textarea id="authGateLink" class="gate-textarea" placeholder="粘贴包含 company_id 和 token 的链接..."></textarea>
    </div>
    <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.85rem;color:var(--text-soft);margin-bottom:0.8rem;cursor:pointer;user-select:none;"><input type="checkbox" id="authGateKeepLogin" checked> 保持登录（公用电脑请取消）</label>
    <button id="btnAuthGateEnter" type="button" class="gate-btn">进入</button>
    <!-- 手动输入折叠区（高级） -->
    <details style="margin-top:0.5rem;">
      <summary>手动输入（高级）</summary>
      <div style="margin-top:0.8rem;">
        <div style="margin-bottom:0.8rem;">
          <label class="gate-label">公司ID</label>
          <input id="authGateCompanyId" class="gate-input" type="text" placeholder="留空=管理员模式">
        </div>
        <div style="margin-bottom:0.8rem;">
          <label class="gate-label">访问令牌</label>
          <input id="authGateToken" class="gate-input" type="password" placeholder="公司访问令牌">
        </div>
        <div style="margin-bottom:0.8rem;">
          <label class="gate-label">库存查询密钥</label>
          <input id="authGateStockKey" class="gate-input" type="password" placeholder="三菱库存查询专用（可选）">
        </div>
      </div>
    </details>
    <p class="gate-foot">密钥仅存在本地浏览器，不会上传</p>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite">已复制</div>

<div class="shell">
  <header class="masthead">
    <div class="masthead-main">
      <div class="brand-line">
        <h1>智能询价系统</h1>
        <span id="planBadge" style="display:none;padding:0.2rem 0.6rem;border-radius:999px;font-size:0.72rem;font-weight:600;color:#fff;line-height:1.4;vertical-align:middle;"></span>
        <span id="userBadge" style="display:none;font-size:0.78rem;color:var(--text-soft);margin-left:0.5rem;vertical-align:middle;"><span id="userBadgeText"></span></span>
        <div id="status" class="status-badge info">等待数据...</div>
        <button id="btnLogout" type="button" style="margin-left:auto;padding:0.35rem 0.9rem;border:1px solid var(--line);border-radius:8px;background:var(--surface-strong);color:var(--text-soft);font-size:0.82rem;cursor:pointer;">退出</button>
      </div>
      <div id="versions" class="version-bar">价格版本: - | 库存版本: -</div>
    </div>
  </header>

  <section class="toolbar" aria-label="查询控制台">
    <div class="toolbar-actions">
      <button id="btnSearch" class="btn btn-search" type="button">智能查询</button>
      <button id="btnRegexConvert" class="btn btn-regex" type="button">库存查询</button>
      <button id="btnMmc" class="btn btn-mmc" type="button">三菱库存</button>
      <button id="btnCopy" class="btn btn-copy" type="button">复制勾选</button>
    </div>

    <div class="toolbar-main">
      <div class="field-group field-group-large">
        <label for="discountStep">折扣步长</label>
        <div class="field-shell">
          <input type="number" id="discountStep" value="0.1" step="0.1" min="0.1" inputmode="decimal">
          <span class="field-unit">百分点</span>
        </div>
      </div>

      <div class="field-group">
        <label for="decimals">小数位数</label>
        <div class="field-shell">
          <input type="number" id="decimals" value="1" step="1" min="0" inputmode="numeric">
        </div>
      </div>

      <div class="field-group">
        <label for="threshold">取整阈值</label>
        <div class="field-shell">
          <input type="number" id="threshold" value="100" step="1" min="0" inputmode="numeric">
        </div>
      </div>
      </div>

      <div class="toolbar-secondary">
        <div class="toolbar-secondary-main">
          <div class="toolbar-control-band">
            <div id="stepPresetControls" class="step-presets toolbar-step-presets">
              <button id="btnDefaultDiscounts" type="button" class="step-preset step-preset-action">配置</button>
            </div>
          </div>

        <div class="result-controls-band">
          <select id="roundingMethod" class="rounding-select">
            <option value="ceil">向上取整</option>
            <option value="round">四舍五入</option>
            <option value="floor">向下取整</option>
          </select>
          <div class="result-stat"><strong id="resultCount">0</strong>结果</div>
          <label class="select-all-toggle"><input id="toggleAllResults" type="checkbox">全选</label>
          <label class="opt-lbl"><input id="chkUntaxedQuote" type="checkbox">未税</label>
        </div>

        <div id="copyColumnControls" class="toolbar-copy toolbar-copy-inline"></div>
      </div>
    </div>
  </section>

  <main class="workspace">
    <section class="query-panel">
      <div class="section-head section-head-compact section-head-inline">
        <h2>输入</h2>
      </div>
      <textarea id="queryInput" class="query-input" placeholder="请输入规格型号...&#10;支持多关键词，例如：&#10;WNMG080408 UC5115"></textarea>
      <div class="query-note query-note-inline">
        <span>勾选项自动置顶</span>
      </div>
    </section>

    <section class="result-panel">
      <div class="result-panel-header">
        <div class="section-head section-head-compact section-head-inline">
          <h2>结果</h2>
        </div>
      </div>

      <div class="results-shell">
        <div id="resultBody" class="result-list" aria-live="polite"></div>
      </div>
    </section>
  </main>
</div>

<div id="defaultDiscountModal" class="discount-config-modal" hidden>
    <div id="defaultDiscountBackdrop" class="discount-config-backdrop"></div>
  <section class="discount-config-card" role="dialog" aria-modal="true" aria-labelledby="defaultDiscountTitle">
    <div class="discount-config-head">
      <div>
        <p class="discount-config-kicker">Default Discount</p>
        <h2 id="defaultDiscountTitle">默认折扣设置</h2>
      </div>
      <button id="btnCloseDefaultDiscounts" type="button" class="discount-config-close" aria-label="关闭">×</button>
    </div>

    <p class="discount-config-copy">按品牌或活动设置默认折扣。保存后，新查询结果会自动套用，未手动改过折扣的当前结果也会同步更新。</p>

    <div class="discount-config-grid">
      <!-- 动态渲染：由 app.js 的 buildDefaultDiscountForm() 根据 discount_rules 生成输入框 -->
      <!-- 兜底隐藏输入（旧版兼容，当 JS 动态渲染失败时回退） -->
      <label class="discount-config-field" for="defaultDiscountEx" hidden>
        <span>EX</span>
        <div class="field-shell">
          <input type="number" id="defaultDiscountEx" min="0" max="100" step="0.1" inputmode="decimal">
          <span class="field-unit">%</span>
        </div>
      </label>
      <label class="discount-config-field" for="defaultDiscountOsg" hidden>
        <span>OSG</span>
        <div class="field-shell">
          <input type="number" id="defaultDiscountOsg" min="0" max="100" step="0.1" inputmode="decimal">
          <span class="field-unit">%</span>
        </div>
      </label>
      <label class="discount-config-field" for="defaultDiscountMitsubishi" hidden>
        <span>三菱</span>
        <div class="field-shell">
          <input type="number" id="defaultDiscountMitsubishi" min="0" max="100" step="0.1" inputmode="decimal">
          <span class="field-unit">%</span>
        </div>
      </label>
      <label class="discount-config-field" for="defaultDiscountOther" hidden>
        <span>其他</span>
        <div class="field-shell">
          <input type="number" id="defaultDiscountOther" min="0" max="100" step="0.1" inputmode="decimal">
          <span class="field-unit">%</span>
        </div>
      </label>
    </div>

    <div class="discount-config-actions">
      <button id="btnResetDefaultDiscounts" type="button" class="btn btn-ghost">恢复默认</button>
      <button id="btnCancelDefaultDiscounts" type="button" class="btn btn-ghost">取消</button>
      <button id="btnSaveDefaultDiscounts" type="button" class="btn btn-search">保存</button>
    </div>
  </section>
</div>

<div id="profitConfigModal" class="discount-config-modal" hidden>
  <div id="profitConfigBackdrop" class="discount-config-backdrop"></div>
  <section class="discount-config-card" role="dialog" aria-modal="true" aria-labelledby="profitConfigTitle">
    <div class="discount-config-head">
      <div>
        <p class="discount-config-kicker">Profit Margin</p>
        <h2 id="profitConfigTitle">整体利润设置</h2>
      </div>
      <button id="btnCloseProfitConfig" type="button" class="discount-config-close" aria-label="关闭">×</button>
    </div>
    <p class="discount-config-copy">设置整体利润率（百分比）。保存后，所有未手动改过利润率的报价行会自动套用新利润率。</p>
    <div class="discount-config-grid discount-config-grid-single">
      <label class="discount-config-field" for="defaultProfitMargin">
        <span>利润率</span>
        <div class="field-shell">
          <input type="number" id="defaultProfitMargin" min="0" max="100" step="0.5" inputmode="decimal">
          <span class="field-unit">%</span>
        </div>
      </label>
    </div>
    <div class="discount-config-actions">
      <button id="btnResetProfitConfig" type="button" class="btn btn-ghost">恢复默认</button>
      <button id="btnCancelProfitConfig" type="button" class="btn btn-ghost">取消</button>
      <button id="btnSaveProfitConfig" type="button" class="btn btn-search">保存</button>
    </div>
  </section>
</div>

  <span class="sq-watermark-text">Powered by 智能询价</span>
  <a href="tel:18863995420" class="sq-watermark-phone" style="display:none;">

  <a href="#" class="sq-watermark-qr" style="display:none;" title="点击查看微信二维码">
    <img class="sq-watermark-qr-img" src="" alt="微信" width="16" height="16" style="vertical-align:-3px;border-radius:2px;" />
  </a>
</div>

<button id="btnBackToTop" class="mobile-back-top" type="button">回到顶部</button>

</body>
</html>
