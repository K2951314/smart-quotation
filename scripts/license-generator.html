<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>License 签发工具（供应商本地）</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --border:#e2e5ea; --text:#1f2329; --muted:#6b7280; --accent:#185FA5; --accent-weak:#E6F1FB; --danger:#A32D2D; --ok:#0F6E56; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
  .wrap { max-width: 760px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:20px; font-weight:500; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
  .card h2 { font-size:14px; font-weight:500; margin:0 0 14px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input[type=text], input[type=date], select, textarea { width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; background:#fff; color:var(--text); }
  textarea { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; min-height:96px; resize:vertical; }
  .row { display:flex; gap:14px; }
  .row > div { flex:1; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .btn { display:inline-block; padding:10px 22px; border:none; border-radius:8px; font-size:14px; cursor:pointer; background:var(--accent); color:#fff; }
  .btn:disabled { background:#b5c8dc; cursor:not-allowed; }
  .btn.secondary { background:var(--accent-weak); color:var(--accent); }
  .result { margin-top:16px; }
  .result .lic { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; background:#fafbfc; border:1px solid var(--border); border-radius:8px; padding:12px; word-break:break-all; white-space:pre-wrap; min-height:60px; }
  .summary { margin-top:12px; font-size:13px; }
  .summary td { padding:3px 0; vertical-align:top; }
  .summary td:first-child { color:var(--muted); padding-right:16px; white-space:nowrap; }
  .status { margin-top:12px; font-size:13px; padding:9px 12px; border-radius:8px; }
  .status.ok { background:#E1F5EE; color:var(--ok); }
  .status.err { background:#FCEBEB; color:var(--danger); }
  .warn { background:#FAEEDA; color:#854F0B; border-radius:8px; padding:9px 12px; font-size:12px; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>License 签发工具</h1>
  <p class="sub">供应商本地使用 · 私钥只在浏览器本地签名，不会上传到任何网络</p>

  <div class="card">
    <h2>1. 密钥</h2>
    <label>RSA 私钥（PEM，必填）</label>
    <input type="file" id="keyFile" accept=".pem,.key,.txt" style="margin-bottom:8px;">
    <textarea id="privateKey" placeholder="粘贴私钥内容，或点上面选文件（keys/license_private.pem）"></textarea>
    <div class="hint">私钥由 <code>py scripts/generate_rsa_keys.py</code> 生成，只保存在你本地，绝不下发。</div>
    <label style="margin-top:14px;">RSA 公钥（PEM，可选——填了会在生成后自动验签确认）</label>
    <textarea id="publicKey" placeholder="粘贴公钥内容（keys/license_public.pem），用于生成后自验签"></textarea>
  </div>

  <div class="card">
    <h2>2. 签发参数</h2>
    <div class="row">
      <div>
        <label>订阅档位</label>
        <select id="tier">
          <option value="free">免费版（free）</option>
          <option value="pro" selected>个人版（pro）</option>
          <option value="team">专业版（team）</option>
        </select>
      </div>
      <div>
        <label>客户名称（customer）</label>
        <input type="text" id="customer" placeholder="如：天津菱华国际贸易有限公司">
        <div class="hint">自由文本，只用于标识+显示在 license 信息里；建议用公司全称</div>
      </div>
    </div>
    <div class="row" style="margin-top:12px;">
      <div>
        <label>订阅时长</label>
        <select id="duration">
          <option value="30">1 个月</option>
          <option value="90">3 个月</option>
          <option value="180">6 个月</option>
          <option value="365" selected>1 年</option>
          <option value="730">2 年</option>
          <option value="custom">自定义日期</option>
        </select>
      </div>
      <div>
        <label>自定义过期日期</label>
        <input type="date" id="customDate" disabled>
        <div class="hint">选择「自定义日期」时生效；否则自动 = 今天 + 时长</div>
      </div>
      <div>
        <label>公司数上限（覆盖预设，可留空）</label>
        <input type="text" id="maxCompanies" placeholder="留空用档位预设">
      </div>
    </div>
  </div>

  <button class="btn" id="generateBtn" style="width:100%;">生成 License</button>

  <div class="result" id="result" style="display:none;">
    <div class="card">
      <h2>3. License 结果</h2>
      <div class="lic" id="licenseOut"></div>
      <div style="margin-top:12px;">
        <button class="btn secondary" id="copyBtn">复制</button>
      </div>
      <table class="summary" id="summary"></table>
      <div class="status" id="verifyStatus"></div>
    </div>
  </div>
</div>

<script>
// ─── 三档预设（与 backend/smart_quotation/license.py TIER_PRESETS 完全一致）──
var TIER_PRESETS = {
  free: { features:["core","customer_portal"], max_companies:1, max_users:1, max_skus:500, max_brands:2, max_config_revisions:3, stock_query_daily_limit:0, audit_log_days:7, watermark:true },
  pro:  { features:["core","customer_portal","stock_query","bundle_encryption","supabase_deploy","api_access","audit_log"], max_companies:1, max_users:3, max_skus:5000, max_brands:-1, max_config_revisions:20, stock_query_daily_limit:50, audit_log_days:30, watermark:false },
  team: { features:["core","customer_portal","stock_query","bundle_encryption","supabase_deploy","api_access","audit_log","admin_member_inheritance","tier_profit_grouping"], max_companies:5, max_users:-1, max_skus:-1, max_brands:-1, max_config_revisions:-1, stock_query_daily_limit:500, audit_log_days:90, watermark:false }
};
var TIER_LABELS = { free:"免费版", pro:"个人版", team:"专业版" };

// ─── 工具函数 ───
function pemToDer(pem) {
  var b64 = pem.replace(/-----BEGIN [^-]+-----/,"").replace(/-----END [^-]+-----/,"").replace(/\s+/g,"");
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}
function utf8ToBytes(s) { return new TextEncoder().encode(s); }
function bytesToBase64(bytes) {
  var bin = "";
  for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function utf8ToBase64(s) { return bytesToBase64(utf8ToBytes(s)); }

// 模拟 Python json.dumps 的字符串序列化（ensure_ascii=True：非 ASCII → \uXXXX）
// 关键：Python 端签名/验签用 ensure_ascii=True，中文会转成 \uXXXX；JS 若不转义，两者字节不一致导致验签失败。
function pyJsonString(s) {
  var out = '"';
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    if (c === 0x22) out += '\\"';
    else if (c === 0x5C) out += '\\\\';
    else if (c >= 0x20 && c <= 0x7E) out += s[i];
    else if (c === 0x08) out += '\\b';
    else if (c === 0x09) out += '\\t';
    else if (c === 0x0A) out += '\\n';
    else if (c === 0x0C) out += '\\f';
    else if (c === 0x0D) out += '\\r';
    else out += '\\u' + ('000' + c.toString(16)).slice(-4);
  }
  out += '"';
  return out;
}

// 递归按 key 字典序 + 紧凑序列化 + Unicode 转义（等价 Python json.dumps(sort_keys=True, separators=(",",":"), ensure_ascii=True)）
function sortedStringify(obj) {
  if (obj === null || typeof obj !== "object") {
    if (typeof obj === "string") return pyJsonString(obj);
    return JSON.stringify(obj);
  }
  if (Array.isArray(obj)) return "[" + obj.map(sortedStringify).join(",") + "]";
  var keys = Object.keys(obj).sort();
  return "{" + keys.map(function(k){ return pyJsonString(k)+":"+sortedStringify(obj[k]); }).join(",") + "}";
}

function addDays(n) {
  var d = new Date();
  d.setDate(d.getDate() + n);
  var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day+"T23:59:59Z";
}

async function importPrivateKey(pem) {
  return crypto.subtle.importKey("pkcs8", pemToDer(pem), {name:"RSASSA-PKCS1-v1_5", hash:"SHA-256"}, false, ["sign"]);
}
async function importPublicKey(pem) {
  return crypto.subtle.importKey("spki", pemToDer(pem), {name:"RSASSA-PKCS1-v1_5", hash:"SHA-256"}, false, ["verify"]);
}

// ─── 主流程 ───
var fileInput = document.getElementById("keyFile");
fileInput.addEventListener("change", function() {
  var f = fileInput.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function(){ document.getElementById("privateKey").value = reader.result; };
  reader.readAsText(f);
});
document.getElementById("duration").addEventListener("change", function(){
  document.getElementById("customDate").disabled = this.value !== "custom";
});

document.getElementById("generateBtn").addEventListener("click", async function() {
  var btn = this;
  var result = document.getElementById("result");
  var verifyEl = document.getElementById("verifyStatus");
  result.style.display = "none";
  verifyEl.className = "status";
  verifyEl.textContent = "";

  var privatePem = document.getElementById("privateKey").value.trim();
  var publicPem = document.getElementById("publicKey").value.trim();
  var tier = document.getElementById("tier").value;
  var customer = document.getElementById("customer").value.trim();
  var maxCompanies = document.getElementById("maxCompanies").value.trim();

  if (!privatePem) { alert("请先粘贴或选择 RSA 私钥"); return; }
  if (!customer) { alert("请填写客户名称"); return; }

  var preset = JSON.parse(JSON.stringify(TIER_PRESETS[tier]));
  if (maxCompanies !== "") {
    var n = Number(maxCompanies);
    if (!Number.isInteger(n) || n < 1) { alert("公司数上限必须是正整数（留空用档位预设）"); return; }
    preset.max_companies = n;
  }

  var dur = document.getElementById("duration").value;
  var expiresAt;
  if (dur === "custom") {
    var cd = document.getElementById("customDate").value;
    if (!cd) { alert("请选择自定义过期日期"); return; }
    expiresAt = cd + "T23:59:59Z";
  } else {
    expiresAt = addDays(parseInt(dur, 10));
  }

  btn.disabled = true;
  btn.textContent = "正在签名…";
  try {
    var privateKey = await importPrivateKey(privatePem);

    var payload = {
      product: "smart-quotation",
      customer: customer,
      tier: tier,
      expires_at: expiresAt,
      features: preset.features,
      max_companies: preset.max_companies,
      max_users: preset.max_users,
      max_skus: preset.max_skus,
      max_brands: preset.max_brands,
      max_config_revisions: preset.max_config_revisions,
      stock_query_daily_limit: preset.stock_query_daily_limit,
      audit_log_days: preset.audit_log_days,
      watermark: preset.watermark,
      issued_at: new Date().toISOString().replace(/\.\d+Z$/,"Z")
    };

    var payloadJson = sortedStringify(payload);
    var sig = await crypto.subtle.sign("RSASSA-PKCS1-v1_5", privateKey, utf8ToBytes(payloadJson));
    var sigB64 = bytesToBase64(new Uint8Array(sig));

    var licenseObj = { alg:"RS256", payload: payload, signature: sigB64 };
    var license = utf8ToBase64(JSON.stringify(licenseObj));

    document.getElementById("licenseOut").textContent = license;
    document.getElementById("summary").innerHTML =
      "<tr><td>档位</td><td>" + TIER_LABELS[tier] + "（" + tier + "）</td></tr>" +
      "<tr><td>客户</td><td>" + escapeHtml(customer) + "</td></tr>" +
      "<tr><td>过期</td><td>" + expiresAt + "</td></tr>" +
      "<tr><td>公司上限</td><td>" + (preset.max_companies === -1 ? "不限" : preset.max_companies) + "</td></tr>" +
      "<tr><td>SKU 上限</td><td>" + (preset.max_skus === -1 ? "不限" : preset.max_skus) + "</td></tr>" +
      "<tr><td>库存查询/天</td><td>" + preset.stock_query_daily_limit + "</td></tr>" +
      "<tr><td>功能</td><td>" + preset.features.join(", ") + "</td></tr>";
    result.style.display = "block";

    if (publicPem) {
      try {
        var pubKey = await importPublicKey(publicPem);
        var ok = await crypto.subtle.verify("RSASSA-PKCS1-v1_5", pubKey, new Uint8Array(sig), utf8ToBytes(payloadJson));
        if (ok) { verifyEl.className = "status ok"; verifyEl.textContent = "✓ 已用公钥验签通过，license 有效"; }
        else { verifyEl.className = "status err"; verifyEl.textContent = "✗ 验签失败：公钥与私钥不匹配"; }
      } catch (e) {
        verifyEl.className = "status err"; verifyEl.textContent = "✗ 公钥验签出错：" + e.message;
      }
    } else {
      verifyEl.className = "status"; verifyEl.textContent = "未填公钥，跳过自验签（部署端会自动验签）";
    }
  } catch (e) {
    alert("签名失败：" + e.message + "\n\n请确认私钥是 PKCS8 PEM 格式（py scripts/generate_rsa_keys.py 生成的即是）");
  } finally {
    btn.disabled = false;
    btn.textContent = "生成 License";
  }
});

document.getElementById("copyBtn").addEventListener("click", async function() {
  var t = document.getElementById("licenseOut").textContent;
  try { await navigator.clipboard.writeText(t); this.textContent = "已复制"; setTimeout(()=>{this.textContent="复制";},1500); }
  catch(e){ alert("复制失败，请手动选中复制"); }
});

function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
</script>
</body>
</html>
