<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重置密码 — 智能询价系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.login-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.08); padding: 40px; width: 400px; max-width: 90vw; }
.login-card h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 8px; }
.login-card .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 32px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; transition: border-color .2s; }
.form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s; }
.btn-primary { background: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
.error-msg { color: #dc2626; font-size: 13px; margin-top: 8px; min-height: 18px; }
.success-msg { color: #059669; font-size: 14px; margin-top: 12px; padding: 12px; background: #ecfdf5; border-radius: 6px; text-align: center; }
.register-link { text-align: center; margin-top: 24px; font-size: 13px; color: #6b7280; }
.register-link a { color: #3b82f6; text-decoration: none; }
.register-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="login-card">
  <h1>设置新密码</h1>
  <p class="subtitle">为您的账户设置一个新密码（至少 8 位）</p>

  <form id="resetForm">
    <div class="form-group">
      <label for="password">新密码</label>
      <input type="password" id="password" required minlength="8" placeholder="至少 8 位">
    </div>
    <div class="form-group">
      <label for="confirm">确认新密码</label>
      <input type="password" id="confirm" required minlength="8" placeholder="再次输入新密码">
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <button type="submit" class="btn btn-primary" id="submitBtn">重置密码</button>
    <div class="success-msg" id="successMsg" style="display:none;">
      密码已重置，请使用新密码登录。
    </div>
  </form>

  <div class="register-link">
    <a href="login.html">前往登录</a>
  </div>
</div>

<script>
function getApiBase() {
  if (window.SQ_PROD_API_BASE) return window.SQ_PROD_API_BASE;
  // ?api= 仅本地开发生效（file:/localhost/127.0.0.1），防生产环境 API 劫持
  const isDev = location.protocol === "file:" || location.hostname === "127.0.0.1" || location.hostname === "localhost";
  const params = new URLSearchParams(location.search);
  let base = (isDev ? params.get("api") : null) || localStorage.getItem("sq_admin_api_base") || "";
  if (!base) {
    if (location.protocol === "file:") base = "http://127.0.0.1:8001";
    else base = location.origin;
  }
  return base;
}

const token = new URLSearchParams(location.search).get("token");
if (!token) {
  document.getElementById("errorMsg").textContent = "无效的重置链接（缺少 token）";
  document.getElementById("submitBtn").disabled = true;
}

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const errEl = document.getElementById("errorMsg");
  errEl.textContent = "";

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  if (password.length < 8) { errEl.textContent = "密码至少 8 位"; return; }
  if (password !== confirm) { errEl.textContent = "两次输入的密码不一致"; return; }

  btn.disabled = true;
  btn.textContent = "重置中...";

  try {
    const resp = await fetch(getApiBase() + "/api/auth/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
    // token 已消费，立即从地址栏清除（防浏览器历史/肩窥残留）
    history.replaceState(null, "", location.pathname);
    document.getElementById("resetForm").style.display = "none";
    document.getElementById("successMsg").style.display = "block";
    setTimeout(() => { window.location.href = "login.html"; }, 2000);
  } catch (err) {
    errEl.textContent = err.message;
    btn.disabled = false;
    btn.textContent = "重置密码";
  }
});
</script>
</body>
</html>
