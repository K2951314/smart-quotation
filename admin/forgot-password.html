<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找回密码 — 智能询价系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.login-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.08); padding: 40px; width: 400px; max-width: 90vw; }
.login-card h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 8px; }
.login-card .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 32px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; transition: border-color .2s; }
.form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s; }
.btn-primary { background: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
.info-msg { color: #059669; font-size: 13px; margin-top: 12px; min-height: 18px; padding: 10px; background: #ecfdf5; border-radius: 6px; }
.error-msg { color: #dc2626; font-size: 13px; margin-top: 8px; min-height: 18px; }
.register-link { text-align: center; margin-top: 24px; font-size: 13px; color: #6b7280; }
.register-link a { color: #3b82f6; text-decoration: none; }
.register-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="login-card">
  <h1>找回密码</h1>
  <p class="subtitle">输入注册邮箱，我们将发送密码重置链接到您的邮箱</p>

  <form id="forgotForm">
    <div class="form-group">
      <label for="email">邮箱</label>
      <input type="email" id="email" required placeholder="admin@company.com">
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <button type="submit" class="btn btn-primary" id="submitBtn">发送重置链接</button>
    <div class="info-msg" id="infoMsg" style="display:none;"></div>
  </form>

  <div class="register-link">
    <a href="login.html">返回登录</a>
  </div>
</div>

<script>
function getApiBase() {
  if (window.SQ_PROD_API_BASE) return window.SQ_PROD_API_BASE;
  // ?api= 仅本地开发生效（file:/localhost/127.0.0.1），防生产环境 API 劫持
  const isDev = location.protocol === "file:" || location.hostname === "127.0.0.1" || location.hostname === "localhost";
  const params = new URLSearchParams(location.search);
  let base = (isDev ? params.get("api") : null) || localStorage.getItem("sq_admin_api_base") || "";
  if (!base) {
    if (location.protocol === "file:") base = "http://127.0.0.1:8001";
    else base = location.origin;
  }
  return base;
}

document.getElementById("forgotForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const errEl = document.getElementById("errorMsg");
  const infoEl = document.getElementById("infoMsg");
  errEl.textContent = "";
  infoEl.style.display = "none";
  btn.disabled = true;
  btn.textContent = "发送中...";

  const email = document.getElementById("email").value.trim();
  try {
    const resp = await fetch(getApiBase() + "/api/auth/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
    infoEl.style.display = "block";
    infoEl.textContent = "如果该邮箱已注册，重置链接已发送到您的邮箱（30 分钟内有效）。";
    btn.textContent = "已发送";
  } catch (err) {
    errEl.textContent = err.message;
    btn.disabled = false;
    btn.textContent = "发送重置链接";
  }
});
</script>
</body>
</html>
